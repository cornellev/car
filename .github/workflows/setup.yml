name: setup

# runs the setup scripts on macos, linux, linux arm, and windows
# the linux jobs run in bare containers, so the scripts install everything a new computer lacks
# tests chuds on linux arm to verify pi can build with the same install, and on macos
on:
  push:
    branches: [main]
    paths: &paths
      - .github/workflows/setup.yml
      - .gitmodules
      - CMakeLists.txt
      - CMakePresets.json
      - justfile
      - elec/**
      - cev-lib/**
      - vendor/pico-sdk
  pull_request:
    paths: *paths
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            setup: ./setup/setup-macos.sh
          - os: ubuntu-latest
            container: debian:12
            setup: ./setup/setup-linux.sh
          - os: ubuntu-24.04-arm
            container: ubuntu:24.04
            setup: ./setup/setup-linux.sh
          - os: windows-latest
            setup: powershell -ExecutionPolicy Bypass -File setup/setup-windows.ps1
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # apt in a bare container would otherwise wait on tzdata's timezone prompt
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: elec
    steps:
      # a student clones with git, but a bare container has none
      # without git, checkout downloads the files with no .git, so the setup script can't fetch submodules
      - name: install git (container)
        if: matrix.container
        working-directory: /
        # the container runs as root on a workspace the runner owns, which git refuses by default
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # no submodules here, because the setup script fetches them
      - uses: actions/checkout@v7

      - name: run setup script
        run: ${{ matrix.setup }}

      - name: build firmware (unix)
        if: runner.os != 'Windows'
        run: just doctor && just build

      # winget writes PATH to the registry, which later steps don't reread
      - name: build firmware (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";" + [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          just doctor && just build

      # the pi builds chuds with the same apt tools, and macos with the xcode command line tools
      - name: test chuds
        if: matrix.os == 'ubuntu-24.04-arm' || runner.os == 'macOS'
        working-directory: .
        run: just cev-lib chuds test
